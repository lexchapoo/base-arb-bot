name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC

jobs:
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "./python[dev]" pip-audit
      - name: Audit installed dependencies
        # Not --strict: the local package (base-arb-bot) is not on PyPI and
        # would otherwise be flagged as un-auditable. Real dependency
        # advisories still fail this step.
        run: pip-audit

  cargo-audit:
    name: cargo-audit (Rust deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cd rust-executor && cargo audit

  echidna:
    name: Echidna (property fuzzing)
    runs-on: ubuntu-latest
    # Fuzzing is slow; run on pushes to master and the weekly schedule, not on
    # every PR. Fork PRs would also lack any needed setup.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: crytic/echidna-action@v2
        with:
          files: contracts/test/echidna/BaseArbExecutorEchidna.sol
          contract: BaseArbExecutorEchidna
          config: contracts/echidna.config.yaml
          solc-version: 0.8.24

  slither:
    name: Slither (Solidity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          # Triaged categories are excluded in slither.config.json (see
          # contracts/SLITHER_TRIAGE.md); a new high-severity finding outside
          # them fails the build.
          fail-on: high
