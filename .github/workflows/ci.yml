name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    name: Python (tests + static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install "./python[dev]"
      - name: Unit tests
        run: python -m pytest -q python/tests
      - name: Signer policy tests
        run: PYTHONPATH=signer-gateway/src python -m pytest -q signer-gateway/tests
      - name: Static compile
        run: |
          python -m compileall -q python/src python/tests
          python -m compileall -q signer-gateway/src signer-gateway/tests \
            scripts_prepare_deployment.py scripts_deploy_via_signer.py

  rust:
    name: Rust (cargo test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-executor
      - name: Test
        run: cd rust-executor && cargo test
      - name: Clippy
        run: cd rust-executor && cargo clippy --all-targets --all-features -- -D warnings

  solidity:
    name: Solidity (forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build
        run: cd contracts && forge build
      - name: Test (excludes Base mainnet forks; those need an RPC secret)
        run: cd contracts && forge test --no-match-path 'test/*Fork.t.sol' -vvv

  fork-test:
    name: Solidity (Base mainnet fork)
    runs-on: ubuntu-latest
    # Needs the BASE_HTTP_RPC secret, which GitHub withholds from fork PRs, so
    # only run on pushes to the repo (and manual dispatch).
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fork tests against pinned Base state
        env:
          BASE_HTTP_RPC: ${{ secrets.BASE_HTTP_RPC }}
          # Drive the live-proxy upgrade rehearsal in BaseProxyUpgradeFork.t.sol. Optional:
          # a missing secret arrives as an empty string, which the test reads as "no proxy
          # configured" and reports as skipped rather than passed. Set both to have CI
          # rehearse the upgrade against the real deployment on every push.
          EXECUTOR_ADDRESS: ${{ secrets.EXECUTOR_ADDRESS }}
          EXECUTOR_OWNER_ADDRESS: ${{ secrets.EXECUTOR_OWNER_ADDRESS }}
        run: cd contracts && forge test --match-path 'test/*Fork.t.sol' -vvv
