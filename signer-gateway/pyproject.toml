[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "base-arb-signer-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "eth-account>=0.13",
  "eth-utils>=5.2",
  "fastapi>=0.115",
  "pydantic-settings>=2.8",
  "rlp>=4.1",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]
